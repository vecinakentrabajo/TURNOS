<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: una columna de móvil. Banda amarilla de taxi arriba (con hueco para tu foto), contenido en tarjetas sobrias, resultados como tira de ticket térmico con puntos guía, pestañas abajo. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#14171A; --ink2:#525A63; --line:#D6DADF;
  --taxi:#FFC700; --taxi-ink:#1A1500;
  --ok:#17803F; --ok-bg:#E1F3E8; --bad:#C0262D; --bad-bg:#FBE4E5; --warn:#8F5400; --warn-bg:#FFEFD0;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1214; --surface:#181C20; --ink:#EEF1F3; --ink2:#A6AEB6; --line:#2C333A;
    --taxi:#FFCB1F; --taxi-ink:#1A1500;
    --ok:#4CC380; --ok-bg:#12301F; --bad:#FF7B72; --bad-bg:#3A1717; --warn:#F2B04A; --warn-bg:#3A2A0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#181C20; --ink:#EEF1F3; --ink2:#A6AEB6; --line:#2C333A;
  --taxi:#FFCB1F; --taxi-ink:#1A1500;
  --ok:#4CC380; --ok-bg:#12301F; --bad:#FF7B72; --bad-bg:#3A1717; --warn:#F2B04A; --warn-bg:#3A2A0D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:480px;margin:0 auto;width:100%}

/* barra de vista previa */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.bar .col{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding-block:8px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--bg);padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--taxi);color:var(--taxi-ink)}
.link{background:none;border:0;color:var(--bg);text-decoration:underline;font-size:12px;padding:6px 0}

/* banda taxi */
.hero{background:var(--taxi);color:var(--taxi-ink);position:relative}
.hero::after{content:"";display:block;height:10px;background:repeating-conic-gradient(var(--taxi-ink) 0 25%,transparent 0 50%) 0 0/20px 20px}
.hero .col{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.hero small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;text-wrap:balance}
.slot{width:112px;height:64px;flex:none;display:grid;place-items:center}
.slot img{width:100%;height:100%;object-fit:cover;border-radius:4px}

main.col{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;text-wrap:balance}
h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.card.flat{border:0;background:transparent;padding:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:5px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;text-align:center}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.yel{background:var(--taxi);border-color:var(--taxi-ink);color:var(--taxi-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn:has(.fi){position:relative;overflow:hidden}
.btn[disabled]{opacity:.55;pointer-events:none}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:3px 8px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--bg);color:var(--ink2)}
.chip.solid{background:var(--ok);color:#fff}
.chip.ink{background:var(--ink);color:var(--bg)}

.steps{display:flex;gap:5px}
.steps span{flex:1;height:6px;background:var(--line)}
.steps span.on{background:var(--ink)}
.steps span.done{background:var(--ok)}
.stepcap{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:-6px}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0}
.thumbs .th button svg{width:14px;height:14px}
.inc{border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:4px;font-size:14px}

.photo{display:flex;flex-direction:column;gap:10px}
.photo .top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.photo .acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:10px 12px;font-size:14px}
.demo{border:2px dashed var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

.field{display:grid;grid-template-columns:1fr 120px;gap:4px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .nm{font-weight:500}
.field input[type=text],.field input[type=time]{width:100%;min-height:44px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:6px 10px;text-align:right;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--ink);outline:none}
.field .src{grid-column:1/-1;margin-top:-2px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;background:var(--bg);border:2px solid var(--line);border-radius:4px;padding:6px 12px;width:100%;text-align:left}
.toggle[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}

.banner{border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px}
.banner .disp{font-size:34px;line-height:1}
.banner.ok{background:var(--ok);color:#fff}
.banner.bad{background:var(--bad);color:#fff}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ink{background:var(--ink);color:var(--bg)}

.ticket{position:relative;background:var(--surface);padding:16px 14px 14px;margin-bottom:10px;border-top:1px solid var(--line)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--surface) 0),linear-gradient(45deg,transparent 6px,var(--surface) 0);background-size:12px 8px}
.tl{display:flex;flex-direction:column;gap:2px;padding-block:8px;border-bottom:1px dotted var(--line)}
.tl:last-child{border-bottom:0}
.tl .h{display:flex;gap:8px;align-items:baseline}
.tl .h b{font-weight:600}
.tl .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.tl .eq{font-family:var(--f-mono);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ic{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;flex:none}
.ic.ok{background:var(--ok);color:#fff}.ic.bad{background:var(--bad);color:#fff}.ic.mute{background:var(--line);color:var(--ink2)}
.ic svg{width:14px;height:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:4px;background:var(--surface);font-weight:500}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
textarea{width:100%;min-height:72px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:8px 10px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink)}
.inp{width:100%;min-height:44px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:6px 10px}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;width:100%;text-align:left}
.li .dt{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:.95;min-width:54px}
.li .dt small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink2);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stats div{padding:12px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.kv b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.05}
.mail{border:1px solid var(--line);border-left:4px solid var(--taxi);background:var(--surface);padding:10px 12px;border-radius:4px;font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .col{display:flex}
nav.tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink2);font-size:12px;font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--taxi)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}

.lock{text-align:center;padding:40px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock svg{width:56px;height:56px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--bg)}
.poster{background:var(--taxi);color:var(--taxi-ink);border-radius:6px;padding:20px 16px 36px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.poster::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-conic-gradient(var(--taxi-ink) 0 25%,transparent 0 50%) 0 0/28px 28px}
.poster h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:48px;line-height:.95;text-wrap:balance}
.poster .pslot{display:grid;place-items:center;min-height:110px}
.poster .pslot svg{width:180px;height:auto}
.poster .pslot img{width:100%;max-height:200px;object-fit:cover;border-radius:4px}
.earn{background:var(--ink);color:var(--bg);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px}
.earn .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:.95;color:var(--taxi);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card,.li,.ticket{transition:border-color .15s}}
</style>

function steps(n){
 var l=['TPV','Taxímetro','FreeNow','Coche','Confirmar','Resultado'];
 var h='<div class="steps">';
 for(var i=1;i<=6;i++)h+='<span class="'+(i<n?'done':(i===n?'on':''))+'"></span>';
 return h+'</div><div class="stepcap">Paso '+n+' de 6 · '+l[n-1]+'</div>';
}
function slotCard(s){
 var st=S.slots[s.k],th=S.thumbs[s.k]||[],n=th.length;
 if(s.k==='servicios')n=Math.max(S.caps,th.length);
 var pill=st==='ok'?'<span class="chip ok">'+(n>0?n+' foto'+(n>1?'s':''):'Leída')+'</span>':(st==='dudosa'?'<span class="chip warn">Pendiente</span>':'<span class="chip mute">Sin subir</span>');
 var h='<div class="card photo"><div class="top"><div class="grow"><b>'+s.t+'</b><div class="small muted">'+s.d+'</div></div>'+pill+'</div>';
 if(th.length)h+='<div class="thumbs">'+th.map(function(u,i){return '<div class="th"><img alt="Foto subida" src="'+u+'"><button data-act="rm" data-k="'+s.k+'" data-i="'+i+'" aria-label="Quitar esta foto">'+I.no+'</button></div>';}).join('')+'</div><p class="small muted">¿Se ve bien? Si no, quita esa foto con la X y sube otra.</p>';
 else if(n>0)h+='<p class="small muted">'+n+' captura'+(n>1?'s':'')+' cargada'+(n>1?'s':'')+'.</p>';
 h+='<div class="acts"><label class="btn sm yel"><input type="file" accept="image/*" multiple class="fi" data-slot="'+s.k+'">'+I.cam+' '+(n?'Añadir otra foto':'Hacer foto o elegir')+'</label>';
 if(st==='none')h+='<button class="btn sm ghost" data-act="dudosa" data-k="'+s.k+'">Saltar y avisar a Iván</button>';
 h+='<button class="btn sm ghost" data-act="inc-open" data-k="'+s.k+'">Reportar incidencia</button></div>';
 var inc=S.slotInc[s.k];
 if(inc&&inc.open)h+='<div class="stack"><textarea id="inc_'+s.k+'" placeholder="¿Qué ha pasado? (no se sube, no se lee, se ve mal…)" aria-label="Qué ha pasado">'+esc(inc.text||'')+'</textarea><div class="row"><button class="btn sm ghost" data-act="inc-cancel" data-k="'+s.k+'">Cancelar</button><button class="btn sm pri grow" data-act="inc-save" data-k="'+s.k+'">Avisar a Iván y seguir</button></div></div>';
 else if(inc&&inc.text)h+='<div class="inc"><b>Incidencia anotada:</b> '+esc(inc.text)+'. Iván la confirmará.</div>';
 else if(st==='dudosa')h+='<div class="inc">Se envía pendiente de confirmar por Iván.</div>';
 return h+'</div>';

function fieldHtml(f){
 var st=f.s?S.slots[f.s]:null;
 var src=f.s?(st==='ok'?'<span class="chip ok">'+(LIVE?'Foto subida: escribe lo que ves':'Leído de foto')+'</span>':'<span class="chip warn">Sin foto: escríbelo o déjalo pendiente</span>'):'<span class="chip ink">Lo tecleas tú</span>';
 var v=S.form[f.k];if(v==null)v='';
 if(typeof v==='number')v=String(v).replace('.',',');
 return '<div class="field"><label class="nm" for="f_'+f.k+'">'+f.l+'</label><input id="f_'+f.k+'" data-f="'+f.k+'" type="text" '+(f.time?'placeholder="hh:mm"':'inputmode="decimal"')+' value="'+esc(v)+'" autocomplete="off"><div class="src">'+src+'</div></div>';
}
function pendList(){var p=[];SLOTS.forEach(function(s){if(S.slots[s.k]==='dudosa')p.push(s.t);});return p;}

 return '<span class="chip '+map[0]+'">'+esc(map[1])+'</span>';

 });

function weekKey(iso){var d=new Date(iso+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return iso_(d);}
function iso_(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
var MSG={g500:'Te quiero. Qué día, de verdad. 💛',g400:'Felicidades, hoy ha sido un gran día.',low:'Ánimo, no todos los días son buenos. Unas veces se tiene suerte y otras no.',rest:'Descansa, te lo mereces.',hmin:12,t1:200,t2:400,t3:500};
function dayStats(d){
 var h=dayHours(d),km=num(d.f.kmTotales)||0,tot=num(d.f.total)||0,parte=d.res.parte||0;
 function avg(fn){var a=S.days.filter(function(x){return x.id!==d.id&&fn(x.date);});if(!a.length)return null;var s2=0;a.forEach(function(x){s2+=x.res.parte||0;});return r2(s2/a.length);}
 return {h:h,km:km,tot:tot,parte:parte,ph:h>0?r2(parte/h):null,pk:km>0?r2(parte/km):null,
  w:avg(function(x){return weekKey(x)===weekKey(d.date);}),m:avg(function(x){return x.slice(0,7)===d.date.slice(0,7);}),y:avg(function(x){return x.slice(0,4)===d.date.slice(0,4);})};
}
function hm(h){var m=Math.round(h*60);return Math.floor(m/60)+' h '+('0'+(m%60)).slice(-2)+' min';}
function driverSent(){
 var d=dayById(S.lastSent)||S.days[0];
 if(!d)return '<div class="lock"><h2>Turno enviado</h2><button class="btn pri" data-act="tab" data-t="home">Volver al inicio</button></div>';
 var st=dayStats(d),h='';
 var val=S.mine?st.tot:st.parte;
 var msg=val>=MSG.t3?MSG.g500:(val>=MSG.t2?MSG.g400:(val<MSG.t1?MSG.low:''));
 h+='<div class="earn"><span class="label" style="color:inherit;opacity:.7">Turno enviado · '+(S.mine?'total del día':'tu beneficio de hoy')+'</span><span class="big">'+eur(val)+'</span><span class="small" style="opacity:.85">'+hm(st.h)+' · '+Math.round(st.km)+' km'+(st.ph!==null?' · '+eur(st.ph)+' por hora':'')+'</span></div>';
 if(msg)h+='<div class="banner ok"><span><b>'+esc(msg)+'</b></span></div>';
 if(st.h>0&&st.h<MSG.hmin)h+='<div class="hint">Hoy has hecho '+hm(st.h)+'. Te faltan '+hm(MSG.hmin-st.h)+' para completar las '+MSG.hmin+' horas.</div>';
 else if(st.h>=MSG.hmin)h+='<div class="hint">Has completado las '+MSG.hmin+' horas. Bien hecho.</div>';
 h+='<div class="card stack"><p><b>'+MSG.rest+'</b></p><p class="muted">'+(d.estado==='VERDE'?'Todo cuadraba. Iván lo da por bueno cuando lo revise.':'Iván ha recibido un aviso para confirmar lo pendiente.')+'</p></div>';
 if(S.more){
  function cmpl(n,a){if(a===null)return '';var df=r2(st.parte-a);return '<div class="row sp"><span>Frente a tu media '+n+' ('+eur(a)+')</span><b>'+(df>=0?'+':'−')+eur(Math.abs(df))+'</b></div>';}
  h+='<div class="card stack"><h3>Saber más</h3>'
   +'<div class="row sp"><span>Horario</span><b>'+esc(d.f.horaIni)+' a '+esc(d.f.horaFin)+'</b></div>'
   +'<div class="row sp"><span>Horas trabajadas</span><b>'+hm(st.h)+'</b></div>'
   +'<div class="row sp"><span>Kilómetros</span><b>'+Math.round(st.km)+' km</b></div>'
   +'<div class="row sp"><span>Total recaudado</span><b>'+eur(st.tot)+'</b></div>'
   +'<div class="row sp"><span>Por hora</span><b>'+(st.ph!==null?eur(st.ph):'—')+'</b></div>'
   +'<div class="row sp"><span>Por km</span><b>'+(st.pk!==null?eur(st.pk):'—')+'</b></div>'
   +(cmpl('de la semana',st.w)+cmpl('del mes',st.m)+cmpl('del año',st.y)||'<p class="muted">Aún no hay otros turnos para comparar.</p>')+'</div>';
 }
 h+='<div class="row"><button class="btn ghost grow" data-act="more">'+(S.more?'Ver menos':'Saber más')+'</button>'+(S.mine?'<button class="btn yel grow" data-act="mine-again">Subir otro turno</button><button class="btn pri grow" data-act="mine-exit">Volver al panel</button>':'<button class="btn pri grow" data-act="tab" data-t="home">Volver al inicio</button>')+'</div>';
 return h;
}

function send(){
 if(LIVE){sendLive();return;}
 if(!S.editing&&sentToday()){S.sendErr='Ya hay un turno enviado hoy para este conductor.';render(true);return;}
 var n=$('nota');if(n)S.texto=n.value;
 var pend=pendList();var res=verify(S.form,S.caps,drv().pct,pend);
 var f={};for(var k in S.form)f[k]=S.form[k];
 var inc=[];SLOTS.forEach(function(s){var x=S.slotInc[s.k];if(x&&x.text)inc.push({slot:s.t,text:x.text});});
 var co={chips:S.coche.chips.slice(),texto:S.coche.texto.trim()};var coche=(co.chips.length||co.texto)?co:null;
 var date;
 if(S.editing){
  var e=dayById(S.editing);e.hist=e.hist||[];e.hist.push({f:e.f,estado:e.estado,res:e.res});
  e.f=f;e.caps=S.caps;e.res=res;e.estado=res.overall;e.pend=pend;e.accepted=false;e.motivos=S.motivos.slice();e.texto=S.texto;e.incid=inc;e.coche=coche;
  S.requests.forEach(function(r){if(r.dayId===e.id&&r.estado==='aprobada')r.estado='hecha';});
  log('Mortada reenvió corregido el día '+dl(e.date));S.lastSent=e.id;S.editing=null;
 }else{
  var day=mkDay({id:S.nextId++,date:TODAY,f:f,caps:S.caps});day.pend=pend;day.res=res;day.estado=res.overall;day.motivos=S.motivos.slice();day.texto=S.texto;day.incid=inc;day.coche=coche;
  S.days.unshift(day);S.lastSent=day.id;
  S.motivos.forEach(function(m){S.problems.unshift({id:S.nextP++,date:TODAY,motivo:m,texto:S.texto,open:true});});
  inc.forEach(function(x){S.problems.unshift({id:S.nextP++,date:TODAY,motivo:'Incidencia con foto: '+x.slot,texto:x.text,open:true});});
  if(coche)S.problems.unshift({id:S.nextP++,date:TODAY,motivo:'Incidencia del coche'+(coche.chips.length?': '+coche.chips.join(', '):''),texto:coche.texto,open:true});
  log('Mortada envió el turno del '+dl(TODAY)+(res.overall==='VERDE'?'':' ('+res.overall.toLowerCase()+')'));
 }
 beep(1);resetForm();S.screen='sent';S.dtab='up';render();
}

function errMsg(j){return (j&&j.msg)||ERR[j&&j.error]||'Algo ha fallado. Inténtalo otra vez.';}
function authCheck(j){
 if(j.error==='BLOQUEADO'&&S.role){S.me=S.me||{id:0,name:'',pct:45};S.me.status='BLOQUEADO';S.view='driver';j.authFail=true;}
 else if(j.error==='NO_AUTENTICADO'||j.error==='SESION_CADUCADA'||(j.error==='BLOQUEADO'&&!S.role)){
  var was=S.role;clearTok();liveReset();
  if(j.error==='BLOQUEADO'){S.role='driver';S.me={id:0,name:'',pct:45,status:'BLOQUEADO'};S.view='driver';}
  else{S.reg=(was==='master'||j.error==='SESION_CADUCADA')?'master':'code';S.regErr=errMsg(j);}
  j.authFail=true;
 }

function call(action,data){
 var body={};for(var k in (data||{}))body[k]=data[k];
 body.action=action;var tk=getTok();if(tk)body.token=tk;
 var p;
 try{p=fetch(window.TURNOS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
 catch(e){p=Promise.reject(e);}
 return p.then(function(j){return (j&&typeof j==='object')?j:{ok:false,error:'ERROR_SERVIDOR'};},function(){return {ok:false,error:'SIN_RED'};})
  .then(function(j){if(!j.ok)authCheck(j);return j;});
}
function dayId(d){return (+d.uid)*100000+Math.round(Date.parse(d.fecha+'T12:00:00Z')/864e5)%100000+(/#2$/.test(d.key||'')?40000:0);}
function mapDay(d){
 var dt=d.datos||{},f=dt.form||{},caps=+dt.caps||0,pend=dt.pend||[],pct=(d.uid===1)?0:(d.pct||45);
 var res=verify(f,caps,pct,pend,d.uid===1);
 return {id:dayId(d),key:d.key,date:d.fecha,driver:d.uid,f:f,caps:caps,pct:pct,res:res,estado:d.estado||res.overall,accepted:d.checkIvan==='Aceptado',motivos:dt.motivos||[],texto:d.nota||'',pend:pend,incid:dt.incid||[],coche:dt.coche||null,carpeta:d.carpeta||'',correccion:d.correccion||''};
}
function mapReq(r){
 var day=S.days.filter(function(x){return x.key===r.clave;})[0],st=String(r.estado||'').toUpperCase(),e;
 if(st==='PENDIENTE')e='pendiente';else if(st==='RECHAZADA')e='rechazada';else e=(day&&day.correccion==='AUTORIZADA')?'aprobada':'hecha';
 return {id:+r.id,uid:+r.uid||(S.me&&S.me.id)||0,dayId:day?day.id:0,key:r.clave,texto:r.motivo||'',estado:e};
}
function mapExp(e){return {id:e.id,uid:e.uid,date:e.fecha,tipo:e.tipo,importe:e.importe,texto:e.texto,fotos:null,estado:String(e.estado||'').toLowerCase(),carpeta:e.carpeta};}
function mapUser(u){
 var st=u.estado;if(st==='ACTIVO'&&u.rol!=='MASTER'&&!u.vinculado)st='POR ACTIVAR';
 if(u.vinculado)delete S.codes[u.id];
 return {id:u.id,name:u.nombre,role:u.rol,status:st,pct:u.pct,device:u.vinculado?(u.dispositivo||'Sí'):'',code:S.codes[u.id]||null};
}
var LOGT={REGISTRO:'activó su móvil',TURNO_ENVIADO:'envió un turno',TURNO_REENVIADO:'reenvió un turno corregido',LOGIN_MASTER:'entró como máster',LOGIN_MASTER_FALLIDO:'intento fallido de entrar como máster',PIDE_CORRECCION:'pidió corregir un día',GASTO:'subió un gasto',ACEPTA_DIA:'aceptó un día',MARCA_PROBLEMA:'marcó un problema',RESUELVE_PROBLEMA:'resolvió un problema',GASTO_APROBADO:'confirmó un gasto',GASTO_RECHAZADO:'rechazó un gasto',GASTO_PAGADO:'pagó un gasto',AUTORIZA_CORRECCION:'autorizó una corrección',RECHAZA_CORRECCION:'rechazó una corrección',ALTA_USUARIO:'dio de alta a un usuario',NUEVO_CODIGO:'generó un código nuevo',USUARIO_BLOQUEADO:'bloqueó a un usuario',USUARIO_ACTIVO:'reactivó a un usuario',USUARIO_ARCHIVADO:'archivó a un usuario',DESVINCULA:'desvinculó un móvil',ERROR:'error del servidor'};
function logDet(a,d){
 d=String(d==null?'':d);
 var m=d.match(/^(\d+)\|(\d{4})-(\d{2})-(\d{2})\s*(.*)$/);
 if(m)return 'día '+m[4]+'/'+m[3]+' de '+fn1(uname(+m[1]))+(m[5]?' · '+m[5]:'');
 if(/^(NUEVO_CODIGO|USUARIO_|DESVINCULA)/.test(a)&&/^\d+$/.test(d))return fn1(uname(+d));
 if(a==='ALTA_USUARIO')return d.replace(/^\d+\s*/,'');
 if(/^\d+$/.test(d))return '';
 return d;
}
function mapLog(l){
 var t=String(l.t||''),m=t.match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/),dt=logDet(l.accion,l.detalle);
 return {t:m?m[2]+'/'+m[1]+' '+m[3]:t,x:(l.uid?fn1(uname(l.uid))+' ':'')+(LOGT[l.accion]||l.accion)+(dt?' · '+dt:'')};
}
function applySnap(j){
 TODAY=iso(new Date());
 S.role=j.role;S.view=(j.role==='master'&&!S.mine)?'master':'driver';
 S.me={id:j.me.id,name:j.me.nombre,pct:(j.role==='master'?0:(j.me.pct||45)),status:j.me.estado||'ACTIVO'};
 S.days=(j.days||[]).filter(function(d){return d.key;}).map(mapDay).sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:a.driver-b.driver);});
 S.expenses=(j.expenses||[]).map(mapExp).sort(function(a,b){return b.id-a.id;});
 if(j.role==='master'){
  S.users=(j.users||[]).map(mapUser).sort(function(a,b){return a.id-b.id;});
  S.requests=(j.requests||[]).map(mapReq);
  S.problems=(j.problems||[]).map(function(p){return {id:p.id,uid:p.uid,date:p.fecha,motivo:p.tipo,texto:p.texto,open:p.estado==='ABIERTO',key:p.clave};}).sort(function(a,b){return b.id-a.id;});
  S.log=(j.log||[]).map(mapLog);
 }else{
  S.users=[];S.problems=[];S.log=[];
  S.requests=(j.requests||[]).map(mapReq);
  if(S.reg!=='welcome')S.reg='done';
 }
}
function refresh(){
 return call('snapshot',{}).then(function(j){
  S.busy=false;
  if(j.ok){applySnap(j);S.err='';}
  else if(!j.authFail)S.err=errMsg(j);
  render(true);
 });
}
function boot(){
 S.netFail=false;S.err='';
 if(!getTok()){S.loading=false;S.role=null;S.reg=S.reg==='master'?'master':'code';render();return;}
 S.loading=true;render();
 call('snapshot',{}).then(function(j){
  S.loading=false;
  if(j.ok)applySnap(j);
  else if(!j.authFail){S.netFail=true;S.err=errMsg(j);}
  render();
 });
}
function doLive(action,data,after){
 if(S.busy)return;
 S.busy=true;S.err='';render(true);
 call(action,data).then(function(j){
  if(!j.ok){S.busy=false;if(!j.authFail)S.err=errMsg(j);render(true);return;}
  if(after)after(j);
  return refresh();
 });
}
function shrink(file){
 return new Promise(function(res,rej){
  var url='';try{url=URL.createObjectURL(file);}catch(e){rej(e);return;}
  var img=new Image();
  img.onload=function(){
   try{
    var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    var data=c.toDataURL('image/jpeg',0.72);URL.revokeObjectURL(url);res(data.split(',')[1]);
   }catch(e){rej(e);}
  };
  img.onerror=function(){try{URL.revokeObjectURL(url);}catch(e){}rej(new Error('img'));};
  img.src=url;
 });
}
function packPhotos(map){
 var list=[],out=[];
 Object.keys(map).forEach(function(k){(map[k]||[]).forEach(function(f){list.push({k:k,f:f});});});
 return list.reduce(function(p,it){return p.then(function(){return shrink(it.f).then(function(b){out.push({slot:it.k,mime:'image/jpeg',b64:b});});});},Promise.resolve()).then(function(){return out;});
}
var PHOTO_ERR='No se ha podido preparar una foto. Quítala y vuelve a subirla.';
function sendLive(){
 if(S.busy)return;
 var n=$('nota');if(n)S.texto=n.value;
 var pend=pendList(),f={};for(var k in S.form)f[k]=S.form[k];
 var inc=[];SLOTS.forEach(function(s){var x=S.slotInc[s.k];if(x&&x.text)inc.push({slot:s.t,text:x.text});});
 var co={chips:S.coche.chips.slice(),texto:S.coche.texto.trim()};var coche=(co.chips.length||co.texto)?co:null;
 var req={form:f,caps:S.caps,pend:pend,incid:inc,coche:coche,motivos:S.motivos.slice(),texto:S.texto,date:shiftDate(),second:!!S.second,mine:!!S.mine};
 if(S.editing){var ed=dayById(S.editing);if(!ed){S.sendErr='No se encuentra el día a corregir.';render(true);return;}req.editKey=ed.key;req.date=ed.date;}
 S.busy=true;S.sendErr='';render(true);
 packPhotos(S.files).then(function(photos){req.photos=photos;return call('submitShift',req);}).then(function(j){
  if(!j.ok){
   if(j.error==='DUPLICADO'&&!S.second&&!S.editing){return refresh().then(function(){
    var ex=S.days.filter(function(x){return x.date===req.date&&x.driver===(S.me&&S.me.id)&&!/#2$/.test(x.key);})[0];
    if(ex&&num(ex.f.impresora)===num(f.impresora)&&num(ex.f.total)===num(f.total)){S.editing=null;resetForm();S.screen='sent';S.dtab='up';S.lastSent=ex.id;S.sendErr='';render(true);return;}
    S.busy=false;S.dupAsk=true;render(true);});}
   S.busy=false;if(!j.authFail)S.sendErr=errMsg(j);render(true);return;}
  S.editing=null;resetForm();S.screen='sent';S.dtab='up';beep(1);
  return refresh().then(function(){var dd=S.days.filter(function(x){return x.key===j.key;})[0];S.lastSent=dd?dd.id:null;render(true);});
 },function(){S.busy=false;S.sendErr=PHOTO_ERR;render(true);});
}
function liveAct(a,d){
 var id=+d.id,dd;
 switch(a){
  case 'retry':boot();return true;
  case 'mine-start':S.mine=true;S.view='driver';S.dtab='up';S.screen='up';S.upStep=1;S.mine=false;S.mineDate=shiftDate();resetForm();S.mine=true;render();window.scrollTo(0,0);return true;
  case 'mine-again':resetForm();S.screen='up';S.dtab='up';S.upStep=1;S.mineDate=S.mineDate||TODAY;render();window.scrollTo(0,0);return true;
  case 'mine-exit':S.mine=false;S.view='master';S.mtab='panel';S.screen='home';S.dtab='home';resetForm();render();window.scrollTo(0,0);return true;
  case 'second-start':S.second=true;render(true);return true;
  case 'second-no':S.dupAsk=false;render(true);return true;
  case 'second-yes':S.dupAsk=false;S.second=true;sendLive();return true;
  case 'reload':if(!S.busy)refresh();return true;
  case 'err-x':S.err='';render(true);return true;
  case 'mlogin-open':S.reg='master';S.regErr='';render();return true;
  case 'mlogin-back':S.reg='code';S.regErr='';render();return true;
  case 'reg':{
   var cv=$('regCode'),val=(cv&&cv.value||'').trim().toUpperCase();
   S.regVal=val;
   if(val.length<6){S.regErr='Escribe el código que te ha dado Iván.';render(true);return true;}
   if(S.busy)return true;
   S.regErr='';S.busy=true;render(true);
   call('register',{code:val}).then(function(j){
    if(!j.ok){S.busy=false;S.regErr=errMsg(j);render(true);return;}
    setTok(j.token);S.regVal='';S.reg='welcome';S.role='driver';
    return refresh();
   });
   return true;}
  case 'mlogin':{
   var pw=$('mpw'),pv=pw?pw.value:'';
   if(!pv){S.regErr='Escribe la clave.';render(true);return true;}
   if(S.busy)return true;
   S.regErr='';S.busy=true;render(true);
   call('loginMaster',{password:pv}).then(function(j){
    if(!j.ok){S.busy=false;S.regErr=errMsg(j);render(true);return;}
    setTok(j.token);S.mtab='panel';S.openDay=null;S.reg='done';
    return refresh().then(function(){window.scrollTo(0,0);});
   });
   return true;}
  case 'logout':
   call('logout',{}).then(function(){clearTok();liveReset();render();});
   return true;
  case 'accept':dd=dayById(id);if(dd)doLive('acceptDay',{key:dd.key},function(){S.openDay=null;});return true;
  case 'flag':dd=dayById(id);if(dd)doLive('addProblem',{key:dd.key,tipo:d.m,texto:'Marcado por Iván desde el día '+dl(dd.date)+'.'},function(){S.mtab='prob';S.openDay=null;});return true;
  case 'resolve':doLive('resolveProblem',{id:id});return true;
  case 'ex-yes':case 'ex-no':case 'ex-paid':doLive('decideExpense',{id:id,decision:a==='ex-yes'?'yes':(a==='ex-no'?'no':'paid')});return true;
  case 'req-yes':case 'req-no':doLive('decideRequest',{id:id,decision:a==='req-yes'?'yes':'no'});return true;
  case 'req-send':{
   dd=dayById(id);var tx=$('reqTxt');if(!dd)return true;
   doLive('requestCorrection',{key:dd.key,motivo:tx?tx.value.trim():''},function(){S.reqOpen=null;});
   return true;}
  case 'ex-send':{
   var imp=num(S.ex.importe);
   if(!S.ex.tipo||!(imp>0)){S.exErr='Elige el tipo de gasto y escribe el importe.';render(true);return true;}
   if(S.busy)return true;
   S.busy=true;S.exErr='';render(true);
   packPhotos({gasto:S.exFiles}).then(function(photos){return call('submitExpense',{tipo:S.ex.tipo,importe:imp,texto:S.ex.texto||'',photos:photos});}).then(function(j){
    if(!j.ok){S.busy=false;if(!j.authFail)S.exErr=errMsg(j);render(true);return;}
    S.ex={tipo:'',importe:'',texto:''};S.exThumbs=[];S.exFiles=[];S.exErr='';beep(1);
    return refresh();
   },function(){S.busy=false;S.exErr=PHOTO_ERR;render(true);});
   return true;}
  case 'block-yes':doLive('setUserState',{id:id,estado:'BLOQUEADO'},function(){S.confirm=null;});return true;
  case 'unblock':doLive('setUserState',{id:id,estado:'ACTIVO'});return true;
  case 'archive':doLive('setUserState',{id:id,estado:'ARCHIVADO'});return true;
  case 'unlink':doLive('newCode',{id:id},function(j){S.codes[id]=j.code;});return true;
  case 'alta-go':{
   var nm=$('altaName'),nv=nm?nm.value.trim():'';
   if(!nv){if(nm)nm.focus();return true;}
   doLive('createUser',{id:id,nombre:nv,pct:45},function(j){S.codes[id]=j.code;S.altaOpen=null;});
   return true;}
 }
 return false;
}
function canAutoRefresh(){
 if(!S.role||S.busy||S.loading)return false;
 if(S.role==='master')return !S.altaOpen;
 return S.dtab!=='up'&&S.dtab!=='exp'&&!S.reqOpen&&S.reg==='done';
}

document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b.dataset);});
document.addEventListener('input',function(e){
 var t=e.target;
 if(!t.dataset)return;
 if(t.dataset.f){S.form[t.dataset.f]=t.value;var l=$('live');if(l)l.innerHTML=liveHtml();}
 if(t.dataset.x)S.ex[t.dataset.x]=t.value;
 if(t.dataset.c){S.coche.texto=t.value;var b=$('closeBtn');if(b)b.textContent=(S.coche.chips.length||t.value.trim())?'Añadir y cerrar turno':'Saltar y cerrar turno';}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t&&t.id==='mineDate'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value||'')){S.mineDate=t.value;return;}
 if(t.dataset&&t.dataset.f&&(t.dataset.f==='horaIni'||t.dataset.f==='horaFin')){var nt=normTime(t.value);if(nt){t.value=nt;S.form[t.dataset.f]=nt;var lv=$('live');if(lv)lv.innerHTML=liveHtml();}}
 if(t.dataset&&t.dataset.slot&&t.files&&t.files.length){
  var k=t.dataset.slot;
  var cur=(k==='gasto')?S.exThumbs:(S.thumbs[k]=S.thumbs[k]||[]);
  var fl=(k==='gasto')?S.exFiles:(S.files[k]=S.files[k]||[]);
  var added=0,cap=(k==='servicios')?12:6;
  Array.prototype.slice.call(t.files).forEach(function(f){
   if(cur.length>=cap)return;
   var u='';try{u=URL.createObjectURL(f);}catch(x){}
   if(!u)return;
   cur.push(u);fl.push(f);added++;if(k==='servicios')S.caps++;
  });
  if(added&&k!=='gasto'){S.slots[k]='ok';applyRead(k);}
  if(added)beep(1);
  try{t.value='';}catch(x){}
  render(true);
 }
});
document.addEventListener('keydown',function(e){
 if(!LIVE||e.key!=='Enter'||!e.target)return;
 if(e.target.id==='mpw')act('mlogin',{});
 else if(e.target.id==='regCode')act('reg',{});
});
document.addEventListener('visibilitychange',function(){if(LIVE&&document.visibilityState==='visible'&&canAutoRefresh())refresh();});
if(LIVE){
 var barEl=document.querySelector('.bar');if(barEl&&barEl.parentNode)barEl.parentNode.removeChild(barEl);
 boot();
}else render();
})();
</script>
