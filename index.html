<!doctype html><html lang="es"><head><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#FFC700"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Turnos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: una columna de móvil. Banda amarilla de taxi arriba (con hueco para tu foto), contenido en tarjetas sobrias, resultados como tira de ticket térmico con puntos guía, pestañas abajo. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#14171A; --ink2:#525A63; --line:#D6DADF;
  --taxi:#FFC700; --taxi-ink:#1A1500;
  --ok:#17803F; --ok-bg:#E1F3E8; --bad:#C0262D; --bad-bg:#FBE4E5; --warn:#8F5400; --warn-bg:#FFEFD0;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1214; --surface:#181C20; --ink:#EEF1F3; --ink2:#A6AEB6; --line:#2C333A;
    --taxi:#FFCB1F; --taxi-ink:#1A1500;
    --ok:#4CC380; --ok-bg:#12301F; --bad:#FF7B72; --bad-bg:#3A1717; --warn:#F2B04A; --warn-bg:#3A2A0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#181C20; --ink:#EEF1F3; --ink2:#A6AEB6; --line:#2C333A;
  --taxi:#FFCB1F; --taxi-ink:#1A1500;
  --ok:#4CC380; --ok-bg:#12301F; --bad:#FF7B72; --bad-bg:#3A1717; --warn:#F2B04A; --warn-bg:#3A2A0D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:480px;margin:0 auto;width:100%}

/* barra de vista previa */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.bar .col{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding-block:8px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--bg) 45%,transparent);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--bg);padding:6px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--taxi);color:var(--taxi-ink)}
.link{background:none;border:0;color:var(--bg);text-decoration:underline;font-size:12px;padding:6px 0}

/* banda taxi */
.hero{background:var(--taxi);color:var(--taxi-ink);position:relative}
.hero::after{content:"";display:block;height:10px;background:repeating-conic-gradient(var(--taxi-ink) 0 25%,transparent 0 50%) 0 0/20px 20px}
.hero .col{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.hero small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero h1{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;text-wrap:balance}
.slot{width:112px;height:64px;flex:none;display:grid;place-items:center}
.slot img{width:100%;height:100%;object-fit:cover;border-radius:4px}

main.col{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;text-wrap:balance}
h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.card.flat{border:0;background:transparent;padding:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:5px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;text-align:center}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.yel{background:var(--taxi);border-color:var(--taxi-ink);color:var(--taxi-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn:has(.fi){position:relative;overflow:hidden}
.btn[disabled]{opacity:.55;pointer-events:none}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:3px;padding:3px 8px;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--bg);color:var(--ink2)}
.chip.solid{background:var(--ok);color:#fff}
.chip.ink{background:var(--ink);color:var(--bg)}

.steps{display:flex;gap:5px}
.steps span{flex:1;height:6px;background:var(--line)}
.steps span.on{background:var(--ink)}
.steps span.done{background:var(--ok)}
.stepcap{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:-6px}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0}
.thumbs .th button svg{width:14px;height:14px}
.inc{border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:4px;font-size:14px}

.photo{display:flex;flex-direction:column;gap:10px}
.photo .top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.photo .acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:10px 12px;font-size:14px}
.demo{border:2px dashed var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}

.field{display:grid;grid-template-columns:1fr 120px;gap:4px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .nm{font-weight:500}
.field input[type=text],.field input[type=time]{width:100%;min-height:44px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:6px 10px;text-align:right;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--ink);outline:none}
.field .src{grid-column:1/-1;margin-top:-2px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;background:var(--bg);border:2px solid var(--line);border-radius:4px;padding:6px 12px;width:100%;text-align:left}
.toggle[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}

.banner{border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px}
.banner .disp{font-size:34px;line-height:1}
.banner.ok{background:var(--ok);color:#fff}
.banner.bad{background:var(--bad);color:#fff}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ink{background:var(--ink);color:var(--bg)}

.ticket{position:relative;background:var(--surface);padding:16px 14px 14px;margin-bottom:10px;border-top:1px solid var(--line)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,var(--surface) 0),linear-gradient(45deg,transparent 6px,var(--surface) 0);background-size:12px 8px}
.tl{display:flex;flex-direction:column;gap:2px;padding-block:8px;border-bottom:1px dotted var(--line)}
.tl:last-child{border-bottom:0}
.tl .h{display:flex;gap:8px;align-items:baseline}
.tl .h b{font-weight:600}
.tl .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.tl .eq{font-family:var(--f-mono);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ic{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;flex:none}
.ic.ok{background:var(--ok);color:#fff}.ic.bad{background:var(--bad);color:#fff}.ic.mute{background:var(--line);color:var(--ink2)}
.ic svg{width:14px;height:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:4px;background:var(--surface);font-weight:500}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
textarea{width:100%;min-height:72px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:8px 10px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink)}
.inp{width:100%;min-height:44px;border:2px solid var(--line);border-radius:4px;background:var(--bg);padding:6px 10px}

.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;width:100%;text-align:left}
.li .dt{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:.95;min-width:54px}
.li .dt small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink2);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stats div{padding:12px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--f-display);font-size:30px;line-height:1}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.kv b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.05}
.mail{border:1px solid var(--line);border-left:4px solid var(--taxi);background:var(--surface);padding:10px 12px;border-radius:4px;font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .col{display:flex}
nav.tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--ink2);font-size:12px;font-weight:600;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--taxi)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px}

.lock{text-align:center;padding:40px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock svg{width:56px;height:56px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--bg)}
.poster{background:var(--taxi);color:var(--taxi-ink);border-radius:6px;padding:20px 16px 36px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.poster::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-conic-gradient(var(--taxi-ink) 0 25%,transparent 0 50%) 0 0/28px 28px}
.poster h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:48px;line-height:.95;text-wrap:balance}
.poster .pslot{display:grid;place-items:center;min-height:110px}
.poster .pslot svg{width:180px;height:auto}
.poster .pslot img{width:100%;max-height:200px;object-fit:cover;border-radius:4px}
.earn{background:var(--ink);color:var(--bg);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:4px}
.earn .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:.95;color:var(--taxi);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card,.li,.ticket{transition:border-color .15s}}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.wait{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:10px 12px;font-size:14px}
.guide{position:relative;height:84px;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:10px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}
.guide i{display:block;height:7px;border-radius:3px;background:currentColor;opacity:.35;filter:blur(1px)}
.guide b{font-size:12px;opacity:.95}
.guide .mk{outline:2px dashed currentColor;outline-offset:3px;border-radius:3px;padding:2px 6px;align-self:flex-start;font-weight:700}
.guide .cap{position:absolute;right:8px;top:6px;font-size:9px;opacity:.75;text-transform:uppercase}
.g-tpv{background:#1d4ed8;color:#e8f0ff}
.g-tax{background:#f4f1e8;color:#3a3a3a;clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),96% 100%,92% calc(100% - 5px),88% 100%,84% calc(100% - 5px),80% 100%,76% calc(100% - 5px),72% 100%,68% calc(100% - 5px),64% 100%,60% calc(100% - 5px),56% 100%,52% calc(100% - 5px),48% 100%,44% calc(100% - 5px),40% 100%,36% calc(100% - 5px),32% 100%,28% calc(100% - 5px),24% 100%,20% calc(100% - 5px),16% 100%,12% calc(100% - 5px),8% 100%,4% calc(100% - 5px),0 100%)}
.g-fn{background:#14213d;color:#dfe7f5}
.slot{background:rgba(255,255,255,.4);border-radius:12px;padding:6px}
.slot svg{width:100%;height:auto;max-height:100%}
.btn svg{width:22px;height:22px;flex:none}
.think{display:flex;align-items:center;gap:12px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 14px;font-size:14px;font-weight:600}
.think svg{width:120px;height:44px;flex:none;overflow:hidden}

.think .rd{animation:road .5s linear infinite}
.think .wl{animation:wheel .5s linear infinite;transform-box:fill-box;transform-origin:center}
.think .wst{display:flex;flex-direction:column;gap:6px;min-width:0}
.wslow{opacity:0;visibility:hidden;animation:rv 0s linear 12s forwards;font-weight:400;display:flex;flex-direction:column;gap:6px}
.wslow .row{flex-wrap:wrap}
@keyframes rv{to{opacity:1;visibility:visible}}
.think .s1{animation:sgn 2.4s linear infinite}.think .s2{animation:sgn 2.4s linear 1.2s infinite}
.think .s1 .sg,.think .s2 .sg{transform:translateX(0)}
.think .tj{animation:hop 1.2s ease-out infinite}
.think .hail{animation:hailx 6s ease-in-out infinite}.think .pe{animation:pexit 6s linear infinite}.think .arm{animation:wave .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom left}
.think .wait{animation:waitx 6s ease-in-out infinite}.think .lr{animation:lred 6s steps(1) infinite}.think .lg{animation:lgrn 6s steps(1) infinite;opacity:.15}
@keyframes sgn{0%{transform:translateX(125px)}100%{transform:translateX(-12px)}}
@keyframes hop{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(-9px)}}
@keyframes hailx{0%{transform:translateX(-70px)}30%,55%{transform:translateX(18px)}100%{transform:translateX(150px)}}
@keyframes pexit{0%,55%{opacity:1}60%,100%{opacity:0}}
@keyframes wave{to{transform:rotate(-35deg)}}
@keyframes waitx{0%,45%{transform:translateX(6px)}100%{transform:translateX(120px)}}
@keyframes lred{0%,45%{opacity:1}46%,100%{opacity:.15}}
@keyframes lgrn{0%,45%{opacity:.15}46%,100%{opacity:1}}
@keyframes road{to{stroke-dashoffset:-16}}
@keyframes wheel{to{transform:rotate(360deg)}}
.draftb{display:flex;flex-direction:column;gap:8px}
.fnh{display:flex;align-items:center;gap:10px}
.fnlogo{width:34px;height:34px;flex:none;border-radius:8px;background:#fff;border:2px solid #e3212b;display:grid;place-items:center}
.fnsum{display:flex;flex-wrap:wrap;gap:6px}
.fnc{display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.fnc.rare{border-color:#e08a00}
.fnc.done{border-color:var(--ok,#1b9e5a)}
.fnc .top2{display:flex;gap:10px;align-items:center}
.fnc img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.fnc .lb{font-size:12px;letter-spacing:.03em;text-transform:uppercase;opacity:.75}
.fnc .pick{min-height:40px;padding:4px 10px;font-size:14px}
.fnc .imp{font-size:20px;font-weight:700}
.think .eye{animation:look 2.4s ease-in-out infinite}
.think .d{animation:dot 1.2s infinite;opacity:.25}
.think .d:nth-of-type(2){animation-delay:.25s}.think .d:nth-of-type(3){animation-delay:.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes look{0%,100%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
.irows{display:flex;flex-direction:column;gap:10px}
.irow{display:flex;gap:10px;align-items:stretch;border:2px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.irow.done{border-color:var(--ok,#1b9e5a)}
.icrop{width:46%;flex:none;border-radius:5px;background-repeat:no-repeat;background-color:#000;min-height:34px;max-height:90px;align-self:center;border:1px solid var(--line)}
.icrop.none{display:grid;place-items:center;color:#aaa;font-size:11px;aspect-ratio:auto;min-height:56px;text-align:center;padding:4px;background:#222}
.iv{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.iv label{font-size:12px;letter-spacing:.03em;text-transform:uppercase;opacity:.75}
.iv input{font-size:20px;font-weight:700;padding:6px 8px;border:2px solid var(--line);border-radius:6px;width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink)}
.iv .acts2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.okbtn{background:#1b9e5a;color:#fff;border:0;border-radius:6px;min-height:40px;padding:6px 12px;font-weight:700;font-size:15px}
.chk{position:fixed;inset:0;z-index:60;background:#0b0d10;color:#fff;display:flex;flex-direction:column}
.chk-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:14px}
.chk-top button,.chk-ctl button{background:#222831;color:#fff;border:1px solid #3a4350;border-radius:6px;min-height:40px;padding:6px 12px;font-size:15px;font-weight:600}
.chk-view{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#000}
.chk-stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.chk-stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}

function facParse(text){

 var amts=[];lines.forEach(function(l,ix){var m=l.match(/\d{1,6}[.,]\d{2}(?!\d)/g);if(m)m.forEach(function(a){var v=num(a.replace(/\s/g,''));if(isFinite(v))amts.push({v:v,tot:/total|importe|a pagar|pagar/i.test(l)});});});

 if(pick)out.imp=String(pick.v).replace('.',',');
 var T=String(text),dm=T.match(/(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/),dd,mm,yy;
 if(dm){yy=+dm[1];mm=+dm[2];dd=+dm[3];}
 else{dm=T.match(/(\d{1,2})\s*(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\.?\s*(?:de\s+)?(\d{2,4})/i);
  if(dm){dd=+dm[1];mm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'].indexOf(dm[2].toLowerCase().replace('set','sep'))+1;yy=+dm[3];}
  else{dm=T.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(dm){dd=+dm[1];mm=+dm[2];yy=+dm[3];}}}
 if(dm){if(yy<100)yy+=2000;if(mm>=1&&mm<=12&&dd>=1&&dd<=31&&yy>=2020&&yy<=2100)out.fecha=yy+'-'+('0'+mm).slice(-2)+'-'+('0'+dd).slice(-2);}

function shrink(file){

  var url='';try{url=URL.createObjectURL(file);}catch(e){rej(e);return;}
  var img=new Image();
  img.onload=function(){
   try{
    var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    var data=c.toDataURL('image/jpeg',0.72);URL.revokeObjectURL(url);res(data.split(',')[1]);
   }catch(e){rej(e);}
  };
  img.onerror=function(){try{URL.revokeObjectURL(url);}catch(e){}rej(new Error('img'));};
  img.src=url;
 });
}

   tryLogin().then(function(j){
    if(!j.ok){S.busy=false;S.regErr=errMsg(j);render(true);return;}
    setTok(j.token,S.loginRem);try{localStorage.setItem('turnos_rem',S.loginRem?'1':'0');if(S.loginRem)localStorage.setItem('turnos_user',uv);else localStorage.removeItem('turnos_user');}catch(e){}
    S.regErr='';S.openDay=null;S.reg='done';S._ccAuto=false;S._posDone=true;if(j.user&&j.user.rol==='MASTER'){S.mtab='cc';S.view='master';}else S.dtab='home';
    return refresh().then(function(){window.scrollTo(0,0);});
   });
   return true;}
  case 'salir':
   if(S.role==='master'){call('logout',{}).then(function(){clearTok();ccClose(true);liveReset();S._ccAuto=false;S.regMode='';render();});}
   else{S.exitAsk=true;render(true);window.scrollTo(0,0);}
   return true;
  case 'pass-set':{var pe=$('pw_'+id),pw0=pe?pe.value:'';S.passMsg=S.passMsg||{};
   if(String(pw0).length<4){S.passMsg[id]='Mínimo 4 caracteres.';render(true);return true;}
   call('setUserPass',{id:id,clave:pw0}).then(function(j){S.passMsg[id]=j.ok?('Contraseña puesta. Entra con el usuario «'+fn1(j.nombre)+'» y esa contraseña.'):(j.msg||errMsg(j));render(true);});
   return true;}
  case 'wait-skip':S.busy=false;S.sendErr='Todavía no hay respuesta. Puedes pulsar Enviar otra vez: si ya había llegado, la app lo detecta y no se duplica.';render(true);return true;
  case 'ocr-skip':S.ocrBusy=0;S.gen=(S.gen||0)+1;S.ocrErr=true;render(true);return true;
  case 'draft-restore':draftRestore();return true;
  case 'draft-drop':S.draftOffer=false;clearDraft();render(true);return true;
  case 'mine-start':S.mine=true;S.view='driver';S.dtab='up';S.screen='up';S.upStep=1;S.mine=false;S.mineDate=shiftDate();resetForm();S.mine=true;S.upStep=2;render();window.scrollTo(0,0);return true;
  case 'mine-again':resetForm();S.screen='up';S.dtab='up';S.upStep=2;S.mineDate=S.mineDate||TODAY;render();window.scrollTo(0,0);return true;
  case 'mine-exit':S.mine=false;S.view='master';S.mtab='panel';S.screen='home';S.dtab='home';resetForm();render();window.scrollTo(0,0);return true;
  case 'second-start':S.second=true;render(true);return true;
  case 'second-no':S.dupAsk=false;render(true);return true;
  case 'second-yes':S.dupAsk=false;S.second=true;sendLive();return true;
  case 'reload':if(!S.busy){refresh();if(S.role==='master')saldoLoad();}return true;
  case 'err-x':S.err='';render(true);return true;
  case 'mlogin-open':S.reg='master';S.regErr='';render();return true;
  case 'mlogin-back':S.reg='code';S.regErr='';render();return true;
  case 'reg':{
   var cv=$('regCode'),val=(cv&&cv.value||'').trim().toUpperCase();
   S.regVal=val;
   if(val.length<6){S.regErr='Escribe el código que te ha dado Iván.';render(true);return true;}
   if(S.busy)return true;
   S.regErr='';S.busy=true;render(true);
   call('register',{code:val}).then(function(j){
    if(!j.ok){S.busy=false;S.regErr=errMsg(j);render(true);return;}
    setTok(j.token);S.regVal='';S.reg='welcome';S.role='driver';
    return refresh();
   });
   return true;}
  case 'mlogin':{
   var pw=$('mpw'),pv=pw?pw.value:'';
   if(!pv){S.regErr='Escribe la clave.';render(true);return true;}
   if(S.busy)return true;
   S.regErr='';S.busy=true;render(true);
   call('loginMaster',{password:pv}).then(function(j){
    if(!j.ok){S.busy=false;S.regErr=errMsg(j);render(true);return;}
    setTok(j.token);S.mtab='cc';S._posDone=true;S.openDay=null;S.reg='done';
    return refresh().then(function(){window.scrollTo(0,0);});
   });
   return true;}
  case 'logout':
   call('logout',{}).then(function(){clearTok();liveReset();render();});
   return true;
  case 'accept':{dd=dayById(id);if(!dd)return true;var am2=$('accMot'),mv=am2?am2.value.trim():'';
   if(dd.estado!=='VERDE'&&!mv){S.accErr='Escribe en una línea por qué aceptas este día.';render(true);return true;}
   S.accErr='';S.accMot='';doLive('acceptDay',{key:dd.key,motivo:mv},function(){S.openDay=null;});return true;}
  case 'flag':dd=dayById(id);if(dd)doLive('addProblem',{key:dd.key,tipo:d.m,texto:'Marcado por Iván desde el día '+dl(dd.date)+'.'},function(){S.mtab='prob';S.openDay=null;});return true;
  case 'resolve':doLive('resolveProblem',{id:id});return true;
  case 'ex-yes':case 'ex-no':case 'ex-paid':doLive('decideExpense',{id:id,decision:a==='ex-yes'?'yes':(a==='ex-no'?'no':'paid')});return true;
  case 'fest-send':dd=dayById(id);if(dd)doLive('requestHoliday',{key:dd.key});return true;
  case 'req-yes':case 'req-no':doLive('decideRequest',{id:id,decision:a==='req-yes'?'yes':'no'});return true;
  case 'req-send':{
   dd=dayById(id);var tx=$('reqTxt');if(!dd)return true;
   doLive('requestCorrection',{key:dd.key,motivo:tx?tx.value.trim():''},function(){S.reqOpen=null;});
   return true;}
  case 'ex-send':{
   var imp=num(S.ex.importe);
   if(!S.ex.tipo||!(imp>0)){S.exErr='Elige el tipo de gasto y escribe el importe.';render(true);return true;}
   if(S.busy)return true;
   S.busy=true;S.exErr='';render(true);
   packPhotos({gasto:S.exFiles}).then(function(photos){return call('submitExpense',{tipo:S.ex.tipo,importe:imp,texto:S.ex.texto||'',photos:photos});}).then(function(j){
    if(!j.ok){S.busy=false;if(!j.authFail)S.exErr=errMsg(j);render(true);return;}
    S.ex={tipo:'',importe:'',texto:''};S.exThumbs=[];S.exFiles=[];S.exErr='';beep(1);
    return refresh();
   },function(){S.busy=false;S.exErr=PHOTO_ERR;render(true);});
   return true;}
  case 'block-yes':doLive('setUserState',{id:id,estado:'BLOQUEADO'},function(){S.confirm=null;});return true;
  case 'unblock':doLive('setUserState',{id:id,estado:'ACTIVO'});return true;
  case 'archive':doLive('setUserState',{id:id,estado:'ARCHIVADO'});return true;
  case 'unlink':doLive('newCode',{id:id},function(j){S.codes[id]=j.code;});return true;
  case 'alta-go':{
   var nm=$('altaName'),nv=nm?nm.value.trim():'';
   if(!nv){if(nm)nm.focus();return true;}
   doLive('createUser',{id:id,nombre:nv,pct:45},function(j){S.codes[id]=j.code;S.altaOpen=null;});
   return true;}
 }
 return false;
}
function canAutoRefresh(){
 if(!S.role||S.busy||S.loading)return false;
 if(S.role==='master')return !S.altaOpen;
 return S.dtab!=='up'&&S.dtab!=='exp'&&!S.reqOpen&&S.reg==='done';
}

document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b.dataset);});
document.addEventListener('input',function(e){
 var t=e.target;
 if(!t.dataset)return;
 if(t.dataset.f){S.form[t.dataset.f]=t.value;if(S.ocr){var oo=S.ocr[t.dataset.f]||(S.ocr[t.dataset.f]={});oo.conf=true;oo.typed=true;oo.ok=true;}var l=$('live');if(l)l.innerHTML=liveHtml();}
 if(t.dataset.fn!==undefined&&S.fn&&S.fn[+t.dataset.fn]){var sv=S.fn[+t.dataset.fn];sv[t.dataset.fk]=t.value;if(t.dataset.fk==='imp')sv.typed=true;sv.conf=false;fnSync();var fs=$('fnsum');if(fs)fs.innerHTML=fnSumHtml();}
 if(t.dataset.t3&&S.t3note)S.t3note.text=t.value;
 if(t.id&&t.id.indexOf('finc_')===0){S.finc=S.finc||{};var fk=t.id.slice(5);(S.finc[fk]=S.finc[fk]||{open:true}).text=t.value;}
 if(t.dataset.km){S.km2=S.km2||{};S.km2[t.dataset.km]=t.value;var ka=num(S.km2.libre),kb=num(S.km2.ocup);if(isFinite(ka)||isFinite(kb)){var ksum=r2((isFinite(ka)?ka:0)+(isFinite(kb)?kb:0));S.form.kmTotales=ksum;S.ocr=S.ocr||{};var ko=S.ocr.kmTotales||(S.ocr.kmTotales={});ko.conf=true;ko.typed=true;ko.ok=true;var kf=$('f_kmTotales');if(kf)kf.value=String(ksum).replace('.',',');var kl=$('live');if(kl)kl.innerHTML=liveHtml();}}
 if(t.id==='accMot')S.accMot=t.value;
 if(t.dataset.x)S.ex[t.dataset.x]=t.value;
 if(t.dataset.fac&&S.fac)S.fac[t.dataset.fac]=t.value;
 if(t.dataset.c){S.coche.texto=t.value;var b=$('closeBtn');if(b)b.textContent=(S.coche.chips.length||t.value.trim())?'Añadir y cerrar turno':'Saltar y cerrar turno';}
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t&&t.classList&&t.classList.contains('fi')){try{localStorage.removeItem('turnos_pick');}catch(x){}}
 if(t&&t.dataset&&t.dataset.fn!==undefined&&S.screen==='up'){render(true);return;}
 if(t&&t.id==='mineDate'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value||'')){S.mineDate=t.value;return;}
 if(t.dataset&&t.dataset.f&&S.screen==='up'&&inlKeys('tpv').concat(inlKeys('taximetro')).indexOf(t.dataset.f)>=0){S.form[t.dataset.f]=t.value;}
 if(t.dataset&&t.dataset.f&&(t.dataset.f==='horaIni'||t.dataset.f==='horaFin')){var nt=normTime(t.value);if(nt){t.value=nt;S.form[t.dataset.f]=nt;var lv=$('live');if(lv)lv.innerHTML=liveHtml();}}
 if(t.dataset&&t.dataset.f&&S.screen==='up'&&inlKeys('tpv').concat(inlKeys('taximetro')).indexOf(t.dataset.f)>=0){render(true);return;}
 if(t.dataset&&t.dataset.slot==='factura'&&t.files&&t.files.length){
  var ff=t.files[0],uu='';try{uu=URL.createObjectURL(ff);}catch(x){}
  S.facFile=ff;S.fac=S.fac||{prov:'',imp:'',fecha:'',tipo:'',thumb:''};S.fac.thumb=uu;try{t.value='';}catch(x){}
  render(true);facRead(ff);return;
 }
 if(t&&t.dataset&&t.dataset.slot&&t.files&&t.files.length){
  var k=t.dataset.slot;
  var cur=(k==='gasto')?S.exThumbs:(S.thumbs[k]=S.thumbs[k]||[]);
  var fl=(k==='gasto')?S.exFiles:(S.files[k]=S.files[k]||[]);
  var added=0,newF=[],cap=(k==='freenow')?FN_MAX:((k==='servicios')?12:6);
  Array.prototype.slice.call(t.files).forEach(function(f){
   if(cur.length>=cap)return;
   var u='';try{u=URL.createObjectURL(f);}catch(x){}
   if(!u)return;
   if(k==='freenow'&&!newF.length)newF.start=(S.fn||[]).length;
   cur.push(u);fl.push(f);newF.push(f);added++;if(k==='servicios')S.caps++;if(k==='freenow'){S.fn=S.fn||[];S.fn.push(fnNew());}
  });
  if(added&&k!=='gasto'){S.slots[k]='ok';applyRead(k);if(k==='taximetro'||k==='tpv')ocrScan(k,newF);if(k==='freenow')fnScan(newF.start,newF);blurCheck(k,newF);}
  if(added)beep(1);
  try{t.value='';}catch(x){}
  render(true);
 }
});
document.addEventListener('keydown',function(e){
 if(!LIVE||e.key!=='Enter'||!e.target)return;
 if(e.target.id==='mpw')act('mlogin',{});
 else if(e.target.id==='lgUser'||e.target.id==='lgPass')act('login',{});
 else if(e.target.id==='regCode')act('reg',{});
});
document.addEventListener('visibilitychange',function(){if(LIVE&&document.visibilityState==='visible'&&canAutoRefresh())refresh();});
if(LIVE){
 var barEl=document.querySelector('.bar');if(barEl&&barEl.parentNode)barEl.parentNode.removeChild(barEl);
 boot();
}else render();
})();
</script>
